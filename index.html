<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Abdulla Alaradi - Portfolio</title>
    
    <style>

              @font-face {
    font-family: 'MyCustomFont';
    src: url('futura-pt/my-font.woff') format('woff');
    font-weight: normal;
    font-style: normal;
}
body {
            font-family: 'MyCustomFont', sans-serif;
            background-color: var(--white);
            color: var(--black);
            overflow-x: hidden;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --black: #000000;
            --white: #ffffff;
            --gray: #333333;
            --light-gray: #f5f5f5;
        }

        

        /* Header Styles */
        header {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            z-index: 1000;
            background-color: var(--white);
            border-bottom: 1px solid var(--black);
            padding: 20px 50px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            transition: all 0.3s ease;
        }

        .logo {
            font-size: 24px;
            font-weight: bold;
            letter-spacing: 2px;
            color: var(--black);
            text-decoration: none;
            transition: transform 0.3s ease;
        }

        .logo:hover {
            transform: scale(1.05);
        }

        nav ul {
            list-style: none;
            display: flex;
            gap: 40px;
        }

        nav a {
            text-decoration: none;
            color: var(--black);
            font-size: 16px;
            letter-spacing: 1px;
            position: relative;
            transition: all 0.3s ease;
        }

        nav a::after {
            content: '';
            position: absolute;
            bottom: -5px;
            left: 0;
            width: 0;
            height: 2px;
            background-color: var(--black);
            transition: width 0.3s ease;
        }

        nav a:hover::after,
        nav a.active::after {
            width: 100%;
        }

        /* Mobile Menu */
        .hamburger {
            display: none;
            flex-direction: column;
            cursor: pointer;
            gap: 5px;
        }

        .hamburger span {
            width: 25px;
            height: 2px;
            background-color: var(--black);
            transition: all 0.3s ease;
        }

        /* Hero Section */
        .hero {
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 0 20px;
            background-color: var(--white);
            position: relative;
            overflow: hidden;
        }

        .hero h1 {
            font-size: 80px;
            font-weight: bold;
            letter-spacing: 5px;
            margin-bottom: 30px;
            opacity: 0;
            transform: translateX(-100%);
        }

        .hero h1.animate {
            animation: slideInLeft 1s ease forwards;
        }

        .hero p {
            font-size: 24px;
            letter-spacing: 2px;
            max-width: 700px;
            line-height: 1.6;
            opacity: 0;
            transform: translateX(100%);
        }

        .hero p.animate {
            animation: slideInRight 1s ease 0.3s forwards;
        }

        @keyframes slideInLeft {
            to {
                opacity: 1;
                transform: translateX(0);
            }
        }

        @keyframes slideInRight {
            to {
                opacity: 1;
                transform: translateX(0);
            }
        }

        .scroll-indicator {
            position: absolute;
            bottom: 40px;
            left: 50%;
            transform: translateX(-50%);
            opacity: 0;
            animation: fadeIn 1s ease 1.5s forwards, bounce 2s ease-in-out 2.5s infinite;
        }

        .scroll-indicator::before {
            content: '';
            display: block;
            width: 2px;
            height: 40px;
            background-color: var(--black);
            margin: 0 auto 10px;
        }

        @keyframes fadeIn {
            to {
                opacity: 1;
            }
        }

        @keyframes bounce {
            0%, 100% {
                transform: translateX(-50%) translateY(0);
            }
            50% {
                transform: translateX(-50%) translateY(10px);
            }
        }

        /* Projects Section */
        .projects-section {
            min-height: 100vh;
            padding: 100px 50px;
            background-color: var(--light-gray);
        }

        .projects-container {
            max-width: 1400px;
            margin: 0 auto;
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 40px;
            padding-top: 50px;
        }

        .project-card {
            position: relative;
            aspect-ratio: 1;
            overflow: hidden;
            cursor: pointer;
            border: 2px solid var(--black);
            opacity: 0;
            transform: translateY(50px) scale(0.9);
            transition: all 0.5s ease;
        }

        .project-card.visible {
            opacity: 1;
            transform: translateY(0) scale(1);
        }

        .project-card:nth-child(1) { transition-delay: 0.1s; }
        .project-card:nth-child(2) { transition-delay: 0.2s; }
        .project-card:nth-child(3) { transition-delay: 0.3s; }
        .project-card:nth-child(4) { transition-delay: 0.4s; }
        .project-card:nth-child(5) { transition-delay: 0.5s; }
        .project-card:nth-child(6) { transition-delay: 0.6s; }

        .project-image {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.6s ease;
        }

        .project-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.85);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            opacity: 0;
            transition: opacity 0.4s ease;
            padding: 20px;
        }

        .project-card:hover .project-overlay {
            opacity: 1;
        }

        .project-card:hover .project-image {
            transform: scale(1.1);
        }

        .project-title {
            font-size: 32px;
            font-weight: bold;
            color: var(--white);
            letter-spacing: 2px;
            margin-bottom: 15px;
            transform: translateY(20px);
            transition: transform 0.4s ease 0.1s;
        }

        .project-card:hover .project-title {
            transform: translateY(0);
        }

        .project-description {
            font-size: 16px;
            color: var(--white);
            letter-spacing: 1px;
            text-align: center;
            transform: translateY(20px);
            transition: transform 0.4s ease 0.2s;
        }

        .project-card:hover .project-description {
            transform: translateY(0);
        }

        /* Footer */
        footer {
            background-color: var(--black);
            color: var(--white);
            padding: 40px 50px;
            text-align: center;
        }

        .social-links {
            display: flex;
            justify-content: center;
            gap: 30px;
            margin-bottom: 20px;
        }

        .social-links a {
            color: var(--white);
            transition: transform 0.3s ease, opacity 0.3s ease;
            display: inline-block;
        }

        .social-links a:hover {
            transform: translateY(-5px);
            opacity: 0.7;
        }

        .social-links svg {
            width: 30px;
            height: 30px;
            fill: var(--white);
        }

        .footer-text {
            font-size: 14px;
            letter-spacing: 1px;
            opacity: 0.7;
        }

        /* Responsive */
        @media (max-width: 768px) {
            header {
                padding: 15px 20px;
            }

            nav {
                position: fixed;
                top: 0;
                right: -100%;
                width: 70%;
                height: 100vh;
                background-color: var(--white);
                flex-direction: column;
                justify-content: center;
                align-items: center;
                transition: right 0.3s ease;
                border-left: 1px solid var(--black);
            }

            nav.active {
                right: 0;
            }

            nav ul {
                flex-direction: column;
                gap: 30px;
            }

            .hamburger {
                display: flex;
                z-index: 1001;
            }

            .hamburger.active span:nth-child(1) {
                transform: rotate(45deg) translate(7px, 7px);
            }

            .hamburger.active span:nth-child(2) {
                opacity: 0;
            }

            .hamburger.active span:nth-child(3) {
                transform: rotate(-45deg) translate(7px, -7px);
            }

            .hero h1 {
                font-size: 50px;
            }

            .hero p {
                font-size: 18px;
            }

            .projects-container {
                grid-template-columns: 1fr;
                padding: 20px;
                gap: 30px;
            }

            .projects-section {
                padding: 80px 20px;
            }
        }

        @media (max-width: 480px) {
            .hero h1 {
                font-size: 40px;
                letter-spacing: 3px;
            }

            .hero p {
                font-size: 16px;
            }

            .project-title {
                font-size: 24px;
            }

            .project-description {
                font-size: 14px;
            }
        }
    </style>

    <script>
        // Hero text animation on load
        window.addEventListener('load', function() {
            setTimeout(function() {
                document.getElementById('heroTitle').classList.add('animate');
            }, 300);
            setTimeout(function() {
                document.getElementById('heroText').classList.add('animate');
            }, 500);
        });

        // Hamburger menu toggle
        const hamburger = document.getElementById('hamburger');
        const nav = document.getElementById('nav');

        hamburger.addEventListener('click', function() {
            hamburger.classList.toggle('active');
            nav.classList.toggle('active');
        });

        // Close menu when clicking on a link
        const navLinks = document.querySelectorAll('nav a');
        navLinks.forEach(link => {
            link.addEventListener('click', function() {
                hamburger.classList.remove('active');
                nav.classList.remove('active');
            });
        });

        // Project cards animation on scroll
        const projectCards = document.querySelectorAll('.project-card');
        
        const observerOptions = {
            threshold: 0.2,
            rootMargin: '0px 0px -100px 0px'
        };

        const observer = new IntersectionObserver(function(entries) {
            entries.forEach(entry => {
                if (entry.isIntersecting) {
                    entry.target.classList.add('visible');
                }
            });
        }, observerOptions);

        projectCards.forEach(card => {
            observer.observe(card);
        });

        // Smooth scroll for all links
        document.querySelectorAll('a[href^="#"]').forEach(anchor => {
            anchor.addEventListener('click', function(e) {
                e.preventDefault();
                const target = document.querySelector(this.getAttribute('href'));
                if (target) {
                    target.scrollIntoView({
                        behavior: 'smooth',
                        block: 'start'
                    });
                }
            });
        });

        // Header hide/show on scroll
        let lastScroll = 0;
        const header = document.querySelector('header');

        window.addEventListener('scroll', function() {
            const currentScroll = window.pageYOffset;
            
            if (currentScroll <= 0) {
                header.style.transform = 'translateY(0)';
            } else if (currentScroll > lastScroll && currentScroll > 100) {
                header.style.transform = 'translateY(-100%)';
            } else if (currentScroll < lastScroll) {
                header.style.transform = 'translateY(0)';
            }
            
            lastScroll = currentScroll;
        });
    </script>
